<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마크다운 실시간 뷰어 &amp; HTML 변환기 | ToolLab</title>
  <meta name="description" content="좌우 분할 화면에서 마크다운(Markdown)을 실시간 미리보기하고, 완성된 HTML 코드를 브라우저에서 바로 내보내거나 복사합니다." />
  <meta name="keywords" content="마크다운에디터, 마크다운미리보기, markdown preview, md뷰어, 마크다운html변환" />
  <link rel="canonical" href="https://toollab.org/ko/tools/markdown-previewer.html" />
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="../../js/analytics.js"></script>
  <style>
    .prose-dark h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.75rem; color: #f8fafc; border-bottom: 1px solid #334155; padding-bottom: 0.3rem; }
    .prose-dark h2 { font-size: 1.25rem; font-weight: 700; margin-top: 1rem; margin-bottom: 0.5rem; color: #f1f5f9; }
    .prose-dark h3 { font-size: 1.1rem; font-weight: 600; margin-top: 0.75rem; margin-bottom: 0.4rem; color: #e2e8f0; }
    .prose-dark p { margin-bottom: 0.75rem; color: #cbd5e1; line-height: 1.7; }
    .prose-dark ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.75rem; color: #cbd5e1; }
    .prose-dark ol { list-style-type: decimal; padding-left: 1.25rem; margin-bottom: 0.75rem; color: #cbd5e1; }
    .prose-dark code { background: #0f172a; padding: 0.2rem 0.4rem; border-radius: 0.375rem; font-family: monospace; font-size: 0.85em; color: #34d399; }
    .prose-dark pre { background: #0b1120; padding: 1rem; border-radius: 0.75rem; border: 1px solid #1e293b; overflow-x: auto; margin-bottom: 0.75rem; }
    .prose-dark blockquote { border-left: 3px solid #10b981; padding-left: 1rem; color: #94a3b8; margin-bottom: 0.75rem; }
    .prose-dark table { width: 100%; border-collapse: collapse; margin-bottom: 0.75rem; }
    .prose-dark th, .prose-dark td { border: 1px solid #334155; padding: 0.5rem 0.75rem; text-align: left; }
    .prose-dark th { background: #1e293b; color: #f8fafc; font-weight: 600; }
  </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col font-sans antialiased selection:bg-emerald-600 selection:text-white">
  <header class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/ko" class="text-xs font-semibold text-slate-400 hover:text-emerald-400 transition-colors">← 도구 목록</a>
        <span class="text-slate-700">|</span>
        <h1 class="text-base font-bold text-slate-100">마크다운 실시간 뷰어</h1>
      </div>
      <div class="flex items-center gap-2">
        <button id="copyHtmlBtn" class="px-3 py-1.5 text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 transition cursor-pointer">
          HTML 복사
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="space-y-2">
        <div class="flex items-center justify-between text-xs text-slate-400">
          <span>마크다운 에디터 (입력)</span>
          <button id="sampleBtn" class="text-emerald-400 hover:underline cursor-pointer">샘플 서식 불러오기</button>
        </div>
        <textarea id="mdInput" placeholder="# 제목을 입력하세요..."
          class="w-full h-[540px] p-4 bg-slate-900 border border-slate-800 rounded-2xl font-mono text-xs text-slate-200 outline-none focus:border-emerald-500 transition leading-relaxed resize-none"></textarea>
      </div>

      <div class="space-y-2">
        <div class="flex items-center justify-between text-xs text-slate-400">
          <span>실시간 미리보기 (렌더링)</span>
          <span class="text-[11px] text-slate-500 font-mono">CommonMark 규격</span>
        </div>
        <div id="mdPreview"
          class="w-full h-[540px] p-6 bg-slate-900/60 border border-slate-800 rounded-2xl overflow-y-auto prose-dark text-xs text-slate-300 leading-relaxed shadow-inner"></div>
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-800 bg-slate-950 py-6 text-xs text-slate-500 text-center">
    <p>© 2026 ToolLab.org · 100% 브라우저 메모리 연산</p>
  </footer>

  <script>
    const input = document.getElementById("mdInput");
    const preview = document.getElementById("mdPreview");
    const copyHtmlBtn = document.getElementById("copyHtmlBtn");
    const sampleBtn = document.getElementById("sampleBtn");

    let timer = null;

    function renderMarkdown() {
      const raw = input.value;
      if (!raw.trim()) {
        preview.innerHTML = '<span class="text-slate-500 italic">미리보기가 여기에 나타납니다.</span>';
        return;
      }
      preview.innerHTML = marked.parse(raw);
    }

    input.addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(renderMarkdown, 150);
    });

    sampleBtn.addEventListener("click", () => {
      input.value = `# ToolLab 마크다운 뷰어

> 100% 브라우저 안에서 동작하는 마이크로 에디터입니다.

### 주요 특징
* **실시간 렌더링**: 입력과 동시에 오른쪽 화면에 표시됩니다.
* **보안성**: 서버에 텍스트가 저장되지 않습니다.

| 기능 | 지원 여부 |
| :--- | :---: |
| 표 (Table) | 완벽 지원 |
| 코드 블록 | \`지원\` |
`;
      renderMarkdown();
    });

    copyHtmlBtn.addEventListener("click", () => {
      const html = marked.parse(input.value);
      navigator.clipboard.writeText(html).then(() => {
        alert("렌더링된 HTML 코드가 클립보드에 복사되었습니다.");
      });
    });

    sampleBtn.click();
  </script>
</body>
</html>
