<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>정규표현식(Regex) 테스터 &amp; 실시간 매칭기 | ToolLab</title>
  <meta name="description" content="JavaScript 정규식(RegExp) 패턴을 브라우저에서 즉시 테스트하고 일치하는 문자열을 실시간 하이라이트로 확인합니다." />
  <meta name="keywords" content="정규식테스터, regex테스터, 정규표현식검사, regexp, 정규식매칭" />
  <link rel="canonical" href="https://toollab.org/ko/tools/regex-tester.html" />
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../js/analytics.js"></script>
  <style>
    .match-highlight { background-color: rgba(16, 185, 129, 0.35); border-bottom: 2px solid #10b981; border-radius: 2px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col font-sans antialiased selection:bg-emerald-600 selection:text-white">
  <header class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/ko" class="text-xs font-semibold text-slate-400 hover:text-emerald-400 transition-colors">← 도구 목록</a>
        <span class="text-slate-700">|</span>
        <h1 class="text-base font-bold text-slate-100">정규표현식(Regex) 테스터</h1>
      </div>
      <span class="text-xs text-emerald-400 font-mono">ECMAScript RegExp</span>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8 flex-1 w-full space-y-6">
    <!-- 정규식 입력 바 -->
    <div class="p-4 bg-slate-900/80 border border-slate-800 rounded-2xl flex items-center gap-3">
      <span class="text-slate-500 font-mono text-lg">/</span>
      <input type="text" id="regexPattern" value="([a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+\.[a-zA-Z0-9._-]+)" placeholder="정규표현식 패턴을 입력하세요 (예: [0-9]+)"
        class="flex-1 bg-transparent border-0 font-mono text-sm text-slate-100 outline-none placeholder-slate-600" />
      <span class="text-slate-500 font-mono text-lg">/</span>
      <input type="text" id="regexFlags" value="g" placeholder="flags"
        class="w-16 bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1 text-xs font-mono text-emerald-400 outline-none text-center" />
    </div>

    <!-- 상태 요약 -->
    <div id="statusWrap" class="flex justify-between items-center text-xs text-slate-400 px-1">
      <span id="matchCount">매칭 결과: <strong class="text-emerald-400">0건</strong></span>
      <span id="regexError" class="text-rose-400 font-semibold"></span>
    </div>

    <!-- 본문 입력 및 하이라이트 뷰 -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="space-y-2">
        <label class="text-xs font-semibold text-slate-400">테스트 대상 본문</label>
        <textarea id="testString" placeholder="테스트할 문자열을 여기에 입력하세요..."
          class="w-full h-80 p-4 bg-slate-900 border border-slate-800 rounded-2xl font-mono text-xs text-slate-200 outline-none focus:border-emerald-500 transition leading-relaxed resize-y">안녕하세요. contact@toollab.org 로 문의주세요. 보조메일은 test_user@naver.com 입니다.</textarea>
      </div>

      <div class="space-y-2">
        <label class="text-xs font-semibold text-slate-400">실시간 매칭 하이라이트</label>
        <div id="highlightViewer" class="w-full h-80 p-4 bg-slate-900/60 border border-slate-800 rounded-2xl font-mono text-xs text-slate-200 overflow-y-auto whitespace-pre-wrap leading-relaxed shadow-inner"></div>
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-800 bg-slate-950 py-6 text-xs text-slate-500 text-center">
    <p>© 2026 ToolLab.org · 100% 브라우저 메모리 연산</p>
  </footer>

  <script>
    const patternInput = document.getElementById("regexPattern");
    const flagsInput = document.getElementById("regexFlags");
    const testStringInput = document.getElementById("testString");
    const highlightViewer = document.getElementById("highlightViewer");
    const matchCountEl = document.getElementById("matchCount");
    const regexErrorEl = document.getElementById("regexError");

    function runTest() {
      const pattern = patternInput.value;
      const flags = flagsInput.value;
      const str = testStringInput.value;

      regexErrorEl.innerText = "";

      if (!pattern) {
        highlightViewer.innerText = str;
        matchCountEl.innerHTML = '매칭 결과: <strong class="text-slate-400">0건</strong>';
        return;
      }

      try {
        const regex = new RegExp(pattern, flags);
        const matches = [...str.matchAll(new RegExp(pattern, flags.includes("g") ? flags : flags + "g"))];
        matchCountEl.innerHTML = `매칭 결과: <strong class="text-emerald-400">${matches.length}건</strong>`;

        if (matches.length === 0) {
          highlightViewer.innerText = str;
          return;
        }

        let html = "";
        let lastIndex = 0;

        matches.forEach(m => {
          const start = m.index;
          const end = m.index + m[0].length;
          html += escapeHtml(str.slice(lastIndex, start));
          html += `<span class="match-highlight">${escapeHtml(m[0])}</span>`;
          lastIndex = end;
        });
        html += escapeHtml(str.slice(lastIndex));

        highlightViewer.innerHTML = html;
      } catch (err) {
        regexErrorEl.innerText = "✕ 올바르지 않은 정규식: " + err.message;
        highlightViewer.innerText = str;
      }
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    patternInput.addEventListener("input", runTest);
    flagsInput.addEventListener("input", runTest);
    testStringInput.addEventListener("input", runTest);

    runTest();
  </script>
</body>
</html>
