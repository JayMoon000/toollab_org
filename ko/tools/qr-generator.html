<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>고화질 벡터 QR코드 생성기 (SVG·PNG 다운로드) | ToolLab</title>
  <meta name="description" content="웹사이트 URL, 와이파이(Wi-Fi), 텍스트를 고해상도 PNG 및 깨지지 않는 SVG 벡터 QR코드로 1초 만에 무료 생성합니다." />
  <meta name="keywords" content="qr코드생성기, 큐알코드만들기, 무료qr코드, qr코드다운로드, svg qr, 와이파이qr코드" />
  <link rel="canonical" href="https://toollab.org/ko/tools/qr-generator.html" />
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="../../js/analytics.js"></script>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col font-sans antialiased selection:bg-emerald-600 selection:text-white">
  <header class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/ko" class="text-xs font-semibold text-slate-400 hover:text-emerald-400 transition-colors">← 도구 목록</a>
        <span class="text-slate-700">|</span>
        <h1 class="text-base font-bold text-slate-100">고화질 벡터 QR코드 생성기</h1>
      </div>
      <span class="text-xs text-emerald-400 font-mono">영구 무료 / 만료일 없음</span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-start">
      <!-- 좌측 인풋 옵션 -->
      <div class="p-6 bg-slate-900/80 border border-slate-800 rounded-3xl space-y-4">
        <div class="space-y-1.5">
          <label class="text-xs font-semibold text-slate-400">QR코드에 담을 내용 (URL 또는 텍스트)</label>
          <textarea id="qrText" placeholder="https://toollab.org 또는 원하는 문구를 입력하세요"
            class="w-full h-32 p-3.5 bg-slate-950 border border-slate-800 rounded-2xl text-xs text-slate-100 outline-none focus:border-emerald-500 transition leading-relaxed resize-none">https://toollab.org/ko</textarea>
        </div>

        <div class="grid grid-cols-2 gap-3 pt-2">
          <div class="space-y-1">
            <label class="text-xs text-slate-400">크기 (픽셀)</label>
            <select id="qrSize" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-200 outline-none focus:border-emerald-500">
              <option value="200">200 x 200 px</option>
              <option value="300" selected>300 x 300 px (권장)</option>
              <option value="500">500 x 500 px (인쇄용)</option>
            </select>
          </div>
          <div class="space-y-1">
            <label class="text-xs text-slate-400">오류 복원율</label>
            <select id="qrCorrect" class="w-full p-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs text-slate-200 outline-none focus:border-emerald-500">
              <option value="M" selected>M (표준 15%)</option>
              <option value="H">H (최고 복원 30%)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 우측 QR 미리보기 및 다운로드 -->
      <div class="p-6 bg-slate-900/80 border border-slate-800 rounded-3xl flex flex-col items-center justify-center space-y-6 text-center">
        <div class="p-4 bg-white rounded-2xl shadow-xl flex items-center justify-center">
          <div id="qrcode"></div>
        </div>

        <button id="downloadBtn" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl transition shadow-lg shadow-emerald-950/50 flex items-center justify-center gap-2 cursor-pointer">
          <span>💾</span>
          <span>고해상도 PNG 다운로드</span>
        </button>
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-800 bg-slate-950 py-6 text-xs text-slate-500 text-center">
    <p>© 2026 ToolLab.org · 100% 브라우저 메모리 연산</p>
  </footer>

  <script>
    const qrText = document.getElementById("qrText");
    const qrSize = document.getElementById("qrSize");
    const qrCorrect = document.getElementById("qrCorrect");
    const qrContainer = document.getElementById("qrcode");
    const downloadBtn = document.getElementById("downloadBtn");

    let qrcodeObj = null;
    let debounceTimer = null;

    function renderQR() {
      const text = qrText.value.trim() || "https://toollab.org/ko";
      const size = parseInt(qrSize.value);
      const correctLevel = qrCorrect.value === "H" ? QRCode.CorrectLevel.H : QRCode.CorrectLevel.M;

      qrContainer.innerHTML = "";
      qrcodeObj = new QRCode(qrContainer, {
        text: text,
        width: size,
        height: size,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: correctLevel
      });
    }

    qrText.addEventListener("input", () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(renderQR, 200);
    });
    qrSize.addEventListener("change", renderQR);
    qrCorrect.addEventListener("change", renderQR);

    downloadBtn.addEventListener("click", () => {
      const img = qrContainer.querySelector("img");
      if (!img || !img.src) {
        alert("QR코드를 생성 중입니다.");
        return;
      }
      const a = document.createElement("a");
      a.href = img.src;
      a.download = "toollab_qrcode.png";
      a.click();
    });

    renderQR();
  </script>
</body>
</html>
