<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D-Day &amp; 영업일 카운트다운 계산기 | ToolLab</title>
  <meta name="description" content="수능, 공무원 시험, 자격증, 커플 기념일까지 남은 날짜(D-Day)와 주말을 제외한 순수 평일(영업일수)을 실시간으로 계산합니다." />
  <meta name="keywords" content="디데이계산기, dday계산기, 영업일계산기, 평일계산기, 날짜수계산, 수능디데이, 시험디데이" />
  <link rel="canonical" href="https://toollab.org/ko/tools/dday-calculator.html" />
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../js/analytics.js"></script>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col font-sans antialiased selection:bg-emerald-600 selection:text-white">
  <header class="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/ko" class="text-xs font-semibold text-slate-400 hover:text-emerald-400 transition-colors">← 도구 목록</a>
        <span class="text-slate-700">|</span>
        <h1 class="text-base font-bold text-slate-100">D-Day &amp; 영업일 계산기</h1>
      </div>
      <span class="text-xs text-emerald-400 font-mono">일정 및 근무일 추적</span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full space-y-6">
    <!-- 날짜 입력 카드 -->
    <div class="p-6 sm:p-8 bg-slate-900/80 border border-slate-800 rounded-3xl space-y-6">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="space-y-1.5">
          <label class="text-xs font-semibold text-slate-400">기준 날짜 (시작일)</label>
          <input type="date" id="startDate" class="w-full p-3.5 bg-slate-950 border border-slate-800 rounded-2xl text-sm font-mono text-slate-100 outline-none focus:border-emerald-500 cursor-pointer" />
        </div>
        <div class="space-y-1.5">
          <label class="text-xs font-semibold text-slate-400">목표 날짜 (종료일)</label>
          <input type="date" id="targetDate" class="w-full p-3.5 bg-slate-950 border border-slate-800 rounded-2xl text-sm font-mono text-slate-100 outline-none focus:border-emerald-500 cursor-pointer" />
        </div>
      </div>

      <!-- 주요 D-Day 메트릭 대시보드 -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-center pt-2">
        <div class="p-5 bg-slate-950/80 border border-slate-800 rounded-2xl space-y-1">
          <span class="text-xs text-slate-400 block">D-Day 표기</span>
          <span id="ddayBadge" class="text-3xl font-black text-emerald-400 font-mono">D-0</span>
        </div>
        <div class="p-5 bg-slate-950/80 border border-slate-800 rounded-2xl space-y-1">
          <span class="text-xs text-slate-400 block">총 남은 기간</span>
          <span id="totalDays" class="text-2xl font-black text-slate-100 font-mono">0일</span>
        </div>
        <div class="p-5 bg-slate-950/80 border border-slate-800 rounded-2xl space-y-1">
          <span class="text-xs text-slate-400 block">순수 평일 (영업일수)</span>
          <span id="businessDays" class="text-2xl font-black text-teal-400 font-mono">0일</span>
        </div>
      </div>

      <!-- 세부 시간 분해 -->
      <div class="p-4 bg-slate-950/40 rounded-2xl border border-slate-800/80 text-xs text-slate-400 flex flex-wrap items-center justify-around gap-2 text-center">
        <div>약 <strong id="weeksCount" class="text-slate-200">0</strong>주</div>
        <div>주말(토/일): <strong id="weekendDays" class="text-slate-200">0</strong>일</div>
        <div>총 시간: 약 <strong id="hoursCount" class="text-slate-200">0</strong>시간</div>
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-800 bg-slate-950 py-6 text-xs text-slate-500 text-center">
    <p>© 2026 ToolLab.org · 100% 브라우저 메모리 연산</p>
  </footer>

  <script>
    const startDateInput = document.getElementById("startDate");
    const targetDateInput = document.getElementById("targetDate");
    const ddayBadge = document.getElementById("ddayBadge");
    const totalDaysEl = document.getElementById("totalDays");
    const businessDaysEl = document.getElementById("businessDays");
    const weeksCountEl = document.getElementById("weeksCount");
    const weekendDaysEl = document.getElementById("weekendDays");
    const hoursCountEl = document.getElementById("hoursCount");

    // 오늘 날짜로 시작일 기본 세팅 (KST 안전 포맷)
    const now = new Date();
    const todayStr = now.toISOString().split("T")[0];
    startDateInput.value = todayStr;

    // 기본 100일 후 목표일 세팅
    const defaultTarget = new Date(now);
    defaultTarget.setDate(now.getDate() + 100);
    targetDateInput.value = defaultTarget.toISOString().split("T")[0];

    function calculateDday() {
      const start = new Date(startDateInput.value);
      const target = new Date(targetDateInput.value);

      if (isNaN(start.getTime()) || isNaN(target.getTime())) return;

      // 시간 정규화 (자정 기준)
      start.setHours(0, 0, 0, 0);
      target.setHours(0, 0, 0, 0);

      const diffTime = target.getTime() - start.getTime();
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

      // D-Day 뱃지 포맷
      if (diffDays === 0) {
        ddayBadge.innerText = "D-DAY";
        ddayBadge.className = "text-3xl font-black text-amber-400 font-mono";
      } else if (diffDays > 0) {
        ddayBadge.innerText = `D-${diffDays}`;
        ddayBadge.className = "text-3xl font-black text-emerald-400 font-mono";
      } else {
        ddayBadge.innerText = `D+${Math.abs(diffDays)}`;
        ddayBadge.className = "text-3xl font-black text-rose-400 font-mono";
      }

      totalDaysEl.innerText = `${Math.abs(diffDays).toLocaleString()}일`;
      weeksCountEl.innerText = (Math.abs(diffDays) / 7).toFixed(1);
      hoursCountEl.innerText = (Math.abs(diffDays) * 24).toLocaleString();

      // 순수 영업일수 계산 (월~금만 카운트)
      let bDays = 0;
      let weekends = 0;
      const minDate = diffDays >= 0 ? new Date(start) : new Date(target);
      const maxDate = diffDays >= 0 ? new Date(target) : new Date(start);

      // 시작일 다음 날부터 목표일까지 카운트
      const cur = new Date(minDate);
      cur.setDate(cur.getDate() + 1);

      while (cur <= maxDate) {
        const dayOfWeek = cur.getDay();
        if (dayOfWeek === 0 || dayOfWeek === 6) {
          weekends++;
        } else {
          bDays++;
        }
        cur.setDate(cur.getDate() + 1);
      }

      businessDaysEl.innerText = `${bDays.toLocaleString()}일`;
      weekendDaysEl.innerText = `${weekends.toLocaleString()}일`;
    }

    startDateInput.addEventListener("change", calculateDday);
    targetDateInput.addEventListener("change", calculateDday);

    calculateDday();
  </script>
</body>
</html>
